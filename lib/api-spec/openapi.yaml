openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: SwiftMatch Recruitment Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: applicants
    description: Applicant profile operations
  - name: assessments
    description: Pre-assessment operations
  - name: jobs
    description: Job postings
  - name: courses
    description: Recommended courses and training
paths:
  /auth/report-access:
    get:
      operationId: getReportAccess
      tags: [auth]
      summary: Get server-controlled report permissions for the confirmed JWT user
      description: Owner bypass or unexpired trusted database entitlement. No entitlement by default. Does not grant or change access.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current permissions
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportAccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /assessments/applicant/{id}/results:
    get:
      operationId: getApplicantReportResults
      tags: [assessments]
      summary: Report results (same authorization as applicant assessment-results alias)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReportForbidden"
        "200":
          description: Own reports with applicant subscription, any reports with employer subscription or owner
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssessmentResult"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /jobs/applications/me:
    get:
      operationId: getOwnJobApplications
      tags: [jobs]
      summary: Own job applications with scores (active report subscription or owner)
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReportForbidden"
        "200":
          description: Own applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobApplicationSummary"
  /jobs/{id}/applications:
    get:
      operationId: getJobApplications
      tags: [jobs]
      summary: Job applicants and scores (employer subscription or owner only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReportForbidden"
        "200":
          description: Applications with candidate identity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobApplicationSummary"
  /resume/match-analysis:
    get:
      operationId: getResumeMatchAnalysis
      tags: [reports]
      summary: Own CV and assessment match analysis (active report subscription or owner)
      security:
        - bearerAuth: []
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReportForbidden"
        "404":
          description: Applicant profile missing
        "422":
          description: Missing CV or assessment scores
        "200":
          description: CV and assessment comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeMatchAnalysis"
  /applicants:
    get:
      operationId: listApplicants
      security:
        - bearerAuth: []
      tags: [applicants]
      summary: List all applicants (employer subscription or owner only)
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReportForbidden"
        "200":
          description: List of applicants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Applicant"
    post:
      operationId: createApplicant
      security:
        - bearerAuth: []
      tags: [applicants]
      summary: Create own applicant profile using authenticated account email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplicantRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReportForbidden"
        "409":
          description: Profile already exists
        "201":
          description: Applicant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Applicant"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /applicants/{id}:
    get:
      operationId: getApplicant
      security:
        - bearerAuth: []
      tags: [applicants]
      summary: Get own basic profile free; other profiles require employer access
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReportForbidden"
        "200":
          description: Applicant details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Applicant"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateApplicant
      security:
        - bearerAuth: []
      description: Own profile or owner only. Email identity cannot be changed.
      tags: [applicants]
      summary: Update applicant profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateApplicantRequest"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReportForbidden"
        "200":
          description: Applicant updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Applicant"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /assessments:
    get:
      operationId: listAssessments
      tags: [assessments]
      summary: List available assessments
      responses:
        "200":
          description: List of assessments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Assessment"

  /assessments/{id}:
    get:
      operationId: getAssessment
      tags: [assessments]
      summary: Get assessment by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Assessment details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assessment"

  /assessments/{id}/submit:
    post:
      operationId: submitAssessment
      security:
        - bearerAuth: []
      description: Requires authenticated ownership (or owner). Immediate quiz feedback remains free.
      tags: [assessments]
      summary: Submit assessment answers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentSubmission"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReportForbidden"
        "200":
          description: Assessment result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentResult"

  /applicants/{id}/assessment-results:
    get:
      operationId: getApplicantAssessmentResults
      security:
        - bearerAuth: []
      description: Applicant subscription permits own results only; employer subscription or owner permits any applicant.
      tags: [assessments]
      summary: Get all assessment results for an applicant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/ReportForbidden"
        "200":
          description: Assessment results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AssessmentResult"

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List job postings
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"

  /jobs/demo/count:
    get:
      operationId: getDemoJobCount
      tags: [jobs]
      summary: "Admin: count demo and real jobs"
      description: Requires `x-admin-token` header matching the SM_ADMIN_TOKEN environment secret.
      parameters:
        - name: x-admin-token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Counts of demo and real jobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  demoCount:
                    type: integer
                  realCount:
                    type: integer
                required: [demoCount, realCount]
        "401":
          description: Unauthorized — missing or wrong admin token
        "503":
          description: Admin token not configured on the server

  /jobs/demo:
    delete:
      operationId: deleteDemoJobs
      tags: [jobs]
      summary: "Admin: wipe all sample/demo job listings"
      description: Requires `x-admin-token` header matching the SM_ADMIN_TOKEN environment secret. Permanently removes all rows where `isDemo = true`.
      parameters:
        - name: x-admin-token
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Number of demo jobs deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: integer
                required: [deleted]
        "401":
          description: Unauthorized — missing or wrong admin token
        "503":
          description: Admin token not configured on the server

  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get job by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /courses:
    get:
      operationId: listCourses
      tags: [courses]
      summary: List recommended courses and training
      responses:
        "200":
          description: List of courses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Course"

  /skills/suggestions:
    get:
      operationId: getSkillSuggestions
      tags: [applicants]
      summary: Get skill keyword suggestions
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Skill suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Missing, invalid, expired JWT, missing user, or unconfirmed account
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ReportForbidden:
      description: Subscription required or applicant access denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReportAccessError"
  schemas:
    JobApplicationSummary:
      type: object
      required: [id, jobTitle, company, status, createdAt]
      properties:
        id:
          type: integer
        jobId:
          type: integer
        applicantId:
          type: integer
        jobTitle:
          type: string
        company:
          type: string
        industry:
          type: [string, "null"]
        status:
          type: string
        keScore:
          type: [number, "null"]
        customScore:
          type: [number, "null"]
        customCorrectCount:
          type: [integer, "null"]
        customTotalCount:
          type: [integer, "null"]
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        email:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
    ResumeMatchAnalysis:
      type: object
      required: [overallAlignment, summary, confirmedStrengths, gapAreas, recommendations, cvProfile, jobsMatched]
      properties:
        overallAlignment:
          type: integer
        summary:
          type: string
        confirmedStrengths:
          type: array
          items:
            type: object
            additionalProperties: true
        gapAreas:
          type: array
          items:
            type: object
            additionalProperties: true
        recommendations:
          type: array
          items:
            type: string
        cvProfile:
          type: object
          additionalProperties: true
        jobsMatched:
          type: integer
    ReportAccess:
      type: object
      required: [canViewReports, canViewCandidatePool]
      properties:
        canViewReports:
          type: boolean
        canViewCandidatePool:
          type: boolean
    ReportAccessError:
      type: object
      required: [error, code, message]
      properties:
        error:
          type: string
          enum: [SUBSCRIPTION_REQUIRED, REPORT_ACCESS_DENIED]
        code:
          type: string
          enum: [SUBSCRIPTION_REQUIRED, REPORT_ACCESS_DENIED]
        message:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    EmploymentHistory:
      type: object
      properties:
        companyName:
          type: string
        position:
          type: string
        yearsStayed:
          type: string
        reasonForLeaving:
          type: string
      required:
        - companyName
        - position
        - yearsStayed
        - reasonForLeaving

    Certificate:
      type: object
      properties:
        name:
          type: string
        issuingOrg:
          type: string
        year:
          type: string
      required:
        - name
        - issuingOrg
        - year

    CharacterReference:
      type: object
      properties:
        name:
          type: string
        relationship:
          type: string
        phone:
          type: string
        email:
          type: string
      required:
        - name
        - relationship
        - phone
        - email

    CreateApplicantRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: ["string", "null"]
        suffix:
          type: ["string", "null"]
        pronoun:
          type: ["string", "null"]
        nickname:
          type: ["string", "null"]
        permanentAddress:
          type: string
        currentAddress:
          type: string
        phoneAreaCode:
          type: string
        phoneNumber:
          type: string
        homePhone:
          type: ["string", "null"]
        email:
          type: string
        skills:
          type: array
          items:
            type: string
          maxItems: 5
        employmentHistory:
          type: array
          items:
            $ref: "#/components/schemas/EmploymentHistory"
        certificates:
          type: array
          items:
            $ref: "#/components/schemas/Certificate"
          maxItems: 3
        references:
          type: array
          items:
            $ref: "#/components/schemas/CharacterReference"
        facebookUrl:
          type: ["string", "null"]
        linkedinUrl:
          type: ["string", "null"]
        targetIndustry:
          type: ["string", "null"]
        targetRole:
          type: ["string", "null"]
        expectedSalary:
          type: ["string", "null"]
        salaryNegotiable:
          type: boolean
        availabilityDate:
          type: string
        status:
          type: string
          enum: [active, pending, shortlisted, failed, hired]
      required:
        - firstName
        - lastName
        - permanentAddress
        - currentAddress
        - phoneAreaCode
        - phoneNumber
        - email
        - skills
        - employmentHistory
        - certificates
        - references
        - salaryNegotiable
        - availabilityDate
        - status

    UpdateApplicantRequest:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: ["string", "null"]
        suffix:
          type: ["string", "null"]
        pronoun:
          type: ["string", "null"]
        nickname:
          type: ["string", "null"]
        permanentAddress:
          type: string
        currentAddress:
          type: string
        phoneAreaCode:
          type: string
        phoneNumber:
          type: string
        homePhone:
          type: ["string", "null"]
        email:
          type: string
        skills:
          type: array
          items:
            type: string
        employmentHistory:
          type: array
          items:
            $ref: "#/components/schemas/EmploymentHistory"
        certificates:
          type: array
          items:
            $ref: "#/components/schemas/Certificate"
        references:
          type: array
          items:
            $ref: "#/components/schemas/CharacterReference"
        facebookUrl:
          type: ["string", "null"]
        linkedinUrl:
          type: ["string", "null"]
        targetIndustry:
          type: ["string", "null"]
        targetRole:
          type: ["string", "null"]
        expectedSalary:
          type: ["string", "null"]
        salaryNegotiable:
          type: boolean
        availabilityDate:
          type: string
        status:
          type: string
          enum: [active, pending, shortlisted, failed, hired]

    Applicant:
      type: object
      properties:
        id:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        middleName:
          type: ["string", "null"]
        suffix:
          type: ["string", "null"]
        pronoun:
          type: ["string", "null"]
        nickname:
          type: ["string", "null"]
        permanentAddress:
          type: string
        currentAddress:
          type: string
        phoneAreaCode:
          type: string
        phoneNumber:
          type: string
        homePhone:
          type: ["string", "null"]
        email:
          type: string
        skills:
          type: array
          items:
            type: string
        employmentHistory:
          type: array
          items:
            $ref: "#/components/schemas/EmploymentHistory"
        certificates:
          type: array
          items:
            $ref: "#/components/schemas/Certificate"
        references:
          type: array
          items:
            $ref: "#/components/schemas/CharacterReference"
        facebookUrl:
          type: ["string", "null"]
        linkedinUrl:
          type: ["string", "null"]
        targetIndustry:
          type: ["string", "null"]
        targetRole:
          type: ["string", "null"]
        expectedSalary:
          type: ["string", "null"]
        salaryNegotiable:
          type: boolean
        availabilityDate:
          type: string
        status:
          type: string
          enum: [active, pending, shortlisted, failed, hired]
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - firstName
        - lastName
        - permanentAddress
        - currentAddress
        - phoneAreaCode
        - phoneNumber
        - email
        - skills
        - employmentHistory
        - certificates
        - references
        - salaryNegotiable
        - availabilityDate
        - status
        - createdAt
        - updatedAt

    AssessmentQuestion:
      type: object
      properties:
        id:
          type: integer
        text:
          type: string
        type:
          type: string
          enum: [multiple_choice, text, rating]
        options:
          type: ["array", "null"]
          items:
            type: string
      required:
        - id
        - text
        - type

    Assessment:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        category:
          type: string
          enum: [knowledge, personality, commitment, situational]
        description:
          type: string
        questions:
          type: array
          items:
            $ref: "#/components/schemas/AssessmentQuestion"
        createdAt:
          type: string
      required:
        - id
        - title
        - category
        - description
        - questions
        - createdAt

    AssessmentAnswer:
      type: object
      properties:
        questionId:
          type: integer
        answer:
          type: string
      required:
        - questionId
        - answer

    AssessmentSubmission:
      type: object
      properties:
        applicantId:
          type: integer
        answers:
          type: array
          items:
            $ref: "#/components/schemas/AssessmentAnswer"
      required:
        - applicantId
        - answers

    AssessmentResult:
      type: object
      properties:
        id:
          type: integer
        applicantId:
          type: integer
        assessmentId:
          type: integer
        assessmentTitle:
          type: string
        score:
          type: number
        passed:
          type: boolean
        feedback:
          type: string
        completedAt:
          type: string
      required:
        - id
        - applicantId
        - assessmentId
        - assessmentTitle
        - score
        - passed
        - feedback
        - completedAt

    Job:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        company:
          type: string
        location:
          type: string
        description:
          type: string
        requirements:
          type: array
          items:
            type: string
        salaryRange:
          type: string
        industry:
          type: string
        isDemo:
          type: boolean
          description: "True if this is a sample/placeholder listing — auto-hidden once real employer jobs exist."
        createdAt:
          type: string
      required:
        - id
        - title
        - company
        - location
        - description
        - requirements
        - salaryRange
        - industry
        - isDemo
        - createdAt

    Course:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        provider:
          type: string
        description:
          type: string
        duration:
          type: string
        category:
          type: string
        skillsGained:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [available, coming_soon, sponsored]
        url:
          type: ["string", "null"]
      required:
        - id
        - title
        - provider
        - description
        - duration
        - category
        - skillsGained
        - status
